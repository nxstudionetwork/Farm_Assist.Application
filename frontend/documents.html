<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Assist - Document Vault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="page-container">
    <nav class="breadcrumb">
      <a href="index.html">Home</a> <span class="bc-sep">/</span>
      <span class="bc-current">Documents</span>
    </nav>

    <section class="hero-dashboard" style="background:var(--gradient-primary); margin-bottom:25px;">
      <h2><i class="fas fa-file-invoice"></i> Document Vault</h2>
      <p style="font-size:13px; color:rgba(255,255,255,0.9); margin-top:5px;">
        Upload and catalogue Land Records, Crop Insurances, purchase invoices, and government subsidy filings.
      </p>
    </section>

    <section class="card-premium">
      <h3 style="font-size:16px; margin-bottom:12px;"><i class="fas fa-cloud-arrow-up" style="color:var(--premium-green); margin-right:8px;"></i> Upload New Document</h3>
      <div class="drag-uploader" id="drag-area">
        <i class="fas fa-file-pdf" style="font-size:36px; color:var(--premium-green); margin-bottom:12px;"></i>
        <h4 style="font-size:14px; margin-bottom:5px;">Drag & Drop files here or click to select</h4>
        <p style="font-size:10px; color:var(--text-muted);">Supports PDF, JPG, PNG up to 10MB</p>
        <input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(event)">
        <div id="upload-progress-container" style="display:none; margin-top:20px; width:100%;">
          <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:700; margin-bottom:4px;">
            <span id="upload-filename">document.pdf</span>
            <span id="upload-percent">0%</span>
          </div>
          <div style="background:var(--border-light); height:6px; border-radius:3px; overflow:hidden;">
            <div id="upload-progress-bar" style="background:var(--premium-green); width:0%; height:100%; transition:width 0.1s;"></div>
          </div>
        </div>
      </div>
    </section>

    <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:15px;" class="chip-filter-row">
      <button class="chip-filter active" onclick="filterDocs('all')">All Files</button>
      <button class="chip-filter" onclick="filterDocs('Land Record')">Land Records</button>
      <button class="chip-filter" onclick="filterDocs('Insurance/Finance')">Insurance</button>
      <button class="chip-filter" onclick="filterDocs('Invoice')">Invoices</button>
      <button class="chip-filter" onclick="filterDocs('Government Document')">Gov Docs</button>
    </div>

    <section class="card-premium">
      <h3 style="font-size:16px; margin-bottom:15px;"><i class="fas fa-list-check" style="color:var(--premium-green); margin-right:8px;"></i> File Directory</h3>
      <div id="docs-directory"></div>
    </section>

  </main>

  <script src="js/database.js"></script>
  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="js/script.js"></script>
  <script>
    let activeFilter = 'all';
    const dragArea = document.getElementById("drag-area");
    const fileInput = document.getElementById("file-input");

    if (dragArea) {
      dragArea.addEventListener("click", () => fileInput.click());
      dragArea.addEventListener("dragover", (e) => { e.preventDefault(); dragArea.classList.add("dragged-over"); });
      dragArea.addEventListener("dragleave", () => { dragArea.classList.remove("dragged-over"); });
      dragArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dragArea.classList.remove("dragged-over");
        if (e.dataTransfer.files.length > 0) uploadSimulate(e.dataTransfer.files[0].name);
      });
    }

    function handleFileSelect(e) {
      if (e.target.files.length > 0) uploadSimulate(e.target.files[0].name);
    }

    function uploadSimulate(name) {
      const container = document.getElementById("upload-progress-container");
      const filename = document.getElementById("upload-filename");
      const percent = document.getElementById("upload-percent");
      const bar = document.getElementById("upload-progress-bar");
      container.style.display = "block";
      filename.textContent = name;
      bar.style.width = "0%";
      percent.textContent = "0%";
      let progress = 0;
      const interval = setInterval(() => {
        progress += 10;
        bar.style.width = `${progress}%`;
        percent.textContent = `${progress}%`;
        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            container.style.display = "none";
            const newDoc = {
              id: FarmDB.documents.length + 1,
              title: name.split(".")[0],
              type: "Invoice",
              date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
              size: "1.2 MB",
              format: name.split(".").pop().toUpperCase() || "PDF",
              url: "#"
            };
            FarmDB.documents.unshift(newDoc);
            showToast("Document uploaded and catalogued in your vault!", "success");
            loadDocuments();
          }, 500);
        }
      }, 150);
    }

    function loadDocuments() {
      const container = document.getElementById("docs-directory");
      if (!container) return;
      container.innerHTML = "";
      const filtered = FarmDB.documents.filter(d => activeFilter === 'all' || d.type === activeFilter);
      filtered.forEach(d => {
        const item = document.createElement("div");
        item.className = "price-card";
        item.style.padding = "15px";
        item.innerHTML = `
          <div class="price-info">
            <div class="price-icon" style="background:rgba(31, 122, 76, 0.1); color:var(--premium-green);"><i class="fas fa-file-pdf"></i></div>
            <div>
              <div class="price-crop" style="font-size:13px; font-weight:600;">${d.title}</div>
              <div style="font-size:10px; color:var(--text-muted);">${d.type} • ${d.date} • ${d.size}</div>
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="widget-action-btn" onclick="showToast('Downloading ${d.title}...','info')"><i class="fas fa-download"></i></button>
            <button class="widget-action-btn" onclick="deleteDoc(${d.id})" style="color:var(--danger);"><i class="fas fa-trash"></i></button>
          </div>`;
        container.appendChild(item);
      });
      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-muted); font-size:12px;">No documents found for this category.</div>`;
      }
    }

    function deleteDoc(id) {
      if (confirm("Are you sure you want to delete this document from your vault?")) {
        const idx = FarmDB.documents.findIndex(d => d.id === id);
        if (idx > -1) { FarmDB.documents.splice(idx, 1); showToast("Document deleted", "warning"); loadDocuments(); }
      }
    }

    function filterDocs(cat) {
      activeFilter = cat;
      document.querySelectorAll(".chip-filter").forEach(c => c.classList.remove("active"));
      event.target.classList.add("active");
      loadDocuments();
    }

    window.addEventListener("load", loadDocuments);
  </script>
</body>
</html>
