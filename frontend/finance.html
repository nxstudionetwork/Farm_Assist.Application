<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Assist - Finance & Insurance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="page-container">

    <!-- Page Header -->
    <div class="page-header">
      <h1><i class="fas fa-wallet"></i> Finance & Insurance</h1>
    </div>

    <!-- Financial Summary Cards -->
    <div class="financial-row">
      <div class="financial-box">
        <div class="financial-box-icon income">
          <i class="fas fa-plus"></i>
        </div>
        <div>
          <div class="financial-box-val">₹1,45,000</div>
          <div class="financial-box-lbl">Income (This Season)</div>
        </div>
      </div>
      <div class="financial-box">
        <div class="financial-box-icon expense">
          <i class="fas fa-minus"></i>
        </div>
        <div>
          <div class="financial-box-val">₹32,150</div>
          <div class="financial-box-lbl">Total Expenses</div>
        </div>
      </div>
    </div>

    <div class="financial-row">
      <div class="financial-box">
        <div class="financial-box-icon" style="background:rgba(31,122,76,0.1); color:var(--premium-green);">
          <i class="fas fa-chart-line"></i>
        </div>
        <div>
          <div class="financial-box-val">₹1,12,850</div>
          <div class="financial-box-lbl">Net Profit</div>
        </div>
      </div>
      <div class="financial-box">
        <div class="financial-box-icon" style="background:rgba(59,130,246,0.1); color:#3b82f6;">
          <i class="fas fa-credit-card"></i>
        </div>
        <div>
          <div class="financial-box-val">₹24,580.45</div>
          <div class="financial-box-lbl">Wallet Balance</div>
        </div>
      </div>
    </div>

    <!-- Income vs Expense Chart Bars -->
    <section class="card-premium">
      <h2 style="font-size:18px; margin-bottom:15px;"><i class="fas fa-chart-bar" style="color:var(--premium-green); margin-right:8px;"></i> Income vs Expenses</h2>
      <div style="display:flex; gap:8px; align-items:flex-end; height:160px; padding:10px 0;">
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:100%; display:flex; gap:3px; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--success); border-radius:6px 6px 0 0; height:100px;"></div>
            <div style="flex:1; background:var(--danger); border-radius:6px 6px 0 0; height:55px;"></div>
          </div>
          <span style="font-size:10px; color:var(--text-secondary);">Jan</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:100%; display:flex; gap:3px; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--success); border-radius:6px 6px 0 0; height:85px;"></div>
            <div style="flex:1; background:var(--danger); border-radius:6px 6px 0 0; height:60px;"></div>
          </div>
          <span style="font-size:10px; color:var(--text-secondary);">Feb</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:100%; display:flex; gap:3px; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--success); border-radius:6px 6px 0 0; height:110px;"></div>
            <div style="flex:1; background:var(--danger); border-radius:6px 6px 0 0; height:50px;"></div>
          </div>
          <span style="font-size:10px; color:var(--text-secondary);">Mar</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:100%; display:flex; gap:3px; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--success); border-radius:6px 6px 0 0; height:70px;"></div>
            <div style="flex:1; background:var(--danger); border-radius:6px 6px 0 0; height:45px;"></div>
          </div>
          <span style="font-size:10px; color:var(--text-secondary);">Apr</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:100%; display:flex; gap:3px; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--success); border-radius:6px 6px 0 0; height:95px;"></div>
            <div style="flex:1; background:var(--danger); border-radius:6px 6px 0 0; height:40px;"></div>
          </div>
          <span style="font-size:10px; color:var(--text-secondary);">May</span>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="width:100%; display:flex; gap:3px; align-items:flex-end; height:120px;">
            <div style="flex:1; background:var(--success); border-radius:6px 6px 0 0; height:60px;"></div>
            <div style="flex:1; background:var(--danger); border-radius:6px 6px 0 0; height:35px;"></div>
          </div>
          <span style="font-size:10px; color:var(--text-secondary);">Jun</span>
        </div>
      </div>
      <div style="display:flex; justify-content:center; gap:20px; font-size:11px; color:var(--text-secondary);">
        <span><span style="display:inline-block; width:10px; height:10px; background:var(--success); border-radius:2px; margin-right:4px;"></span> Income</span>
        <span><span style="display:inline-block; width:10px; height:10px; background:var(--danger); border-radius:2px; margin-right:4px;"></span> Expenses</span>
      </div>
    </section>

    <!-- Transactions List -->
    <section class="card-premium">
      <h2 style="font-size:18px; margin-bottom:15px;"><i class="fas fa-exchange-alt" style="color:var(--premium-green); margin-right:8px;"></i> Recent Transactions</h2>
      <div id="transactions-list">
        <!-- Loaded via JS -->
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="card-premium">
      <h2 style="font-size:18px; margin-bottom:15px;"><i class="fas fa-bolt" style="color:var(--premium-green); margin-right:8px;"></i> Quick Actions</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
        <button class="btn-primary" style="font-size:12px; padding:12px; border-radius:12px;" onclick="showToast('Add a new transaction...','info')">
          <i class="fas fa-plus-circle"></i><br>Add Transaction
        </button>
        <button class="btn-secondary" style="font-size:12px; padding:12px; border-radius:12px;" onclick="window.location.href='reports.html'">
          <i class="fas fa-file-alt"></i><br>View Reports
        </button>
        <button class="btn-secondary" style="font-size:12px; padding:12px; border-radius:12px;" onclick="showToast('Exporting financial data...','success')">
          <i class="fas fa-download"></i><br>Export
        </button>
      </div>
    </section>

  </main>

  <script src="js/database.js"></script>
  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
