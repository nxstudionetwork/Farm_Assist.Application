<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Assist - Notifications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="page-container">

    <section class="card-premium" style="display:flex; justify-content:space-between; align-items:center; padding:20px;">
      <div>
        <h2 style="font-size:18px;"><i class="fas fa-bell" style="color:var(--premium-green); margin-right:8px;"></i> Notifications</h2>
        <p style="font-size:12px; color:var(--text-secondary); margin-top:2px;">Swipe or click cards to clear them.</p>
      </div>
      <button class="btn-secondary" style="padding:10px 16px; border-radius:12px; font-size:12px;" id="notif-clear-all">
        <i class="fas fa-trash-alt"></i> Clear All
      </button>
    </section>

    <section class="card-premium" style="padding:15px 12px;">
      <div id="notif-list-container"></div>
    </section>

  </main>

  <script src="js/database.js"></script>
  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
